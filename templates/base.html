<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Drogaria MaLu{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #FAF4F6; color: #1E1222; display: flex; }
        .sidebar { width: 270px; height: 100vh; background-color: #F8D9E3; position: fixed; padding: 25px 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .logo { display: flex; justify-content: center; margin-bottom: 20px; }
        .logo img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; }
        .menu { display: flex; flex-direction: column; gap: 6px; }
        .menu a { display: flex; align-items: center; gap: 12px; color: #211224; text-decoration: none; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; }
        .menu a:hover { background-color: #EBC1D0; }
        .menu a.active { background-color: #E3B2C3; font-weight: 700; }
        .content { margin-left: 270px; padding: 40px 50px; width: calc(100% - 270px); min-height: 100vh; }
        h1 { font-size: 28px; margin-bottom: 20px; }
        .card { background: #FFFFFF; padding: 25px; border-radius: 18px; border: 1px solid #F3E0E7; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="{{ url_for('static', filename='fundo_novo.png') }}" alt="Logo">
        </div>
        <div class="menu">
            <a href="{{ url_for('dashboard') }}" class="{% if request.path == '/' %}active{% endif %}"><span>🏠</span> Dashboard</a>
            <a href="{{ url_for('medicamentos') }}" class="{% if 'medicamento' in request.path %}active{% endif %}"><span>💊</span> Medicamentos</a>
            <a href="{{ url_for('categorias') }}" class="{% if 'categoria' in request.path %}active{% endif %}"><span>🏷️</span> Categorias</a>
            <a href="{{ url_for('clientes') }}" class="{% if 'cliente' in request.path %}active{% endif %}"><span>👥</span> Clientes</a>
            <a href="{{ url_for('vendas') }}" class="{% if 'venda' in request.path %}active{% endif %}"><span>🛒</span> Vendas</a>
            <a href="{{ url_for('estoque') }}" class="{% if request.path == '/estoque' %}active{% endif %}"><span>📦</span> Saldo Estoque</a>
            <a href="{{ url_for('entrada_estoque') }}" class="{% if 'entrada' in request.path %}active{% endif %}"><span>📥</span> Entrada Lote</a>
            <a href="{{ url_for('saida_estoque') }}" class="{% if 'saida' in request.path %}active{% endif %}"><span>📤</span> Saída Lote</a>
            <a href="{{ url_for('relatorios') }}" class="{% if 'relatorio' in request.path %}active{% endif %}"><span>📊</span> Relatórios</a>
            <a href="{{ url_for('dashboard') }}"><span>🚪</span> Sair</a>
        </div>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
