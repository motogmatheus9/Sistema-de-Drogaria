{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📥 Entrada de Estoque</h2>
    <a href="{{ url_for('estoque') }}" class="btn btn-secondary">Voltar ao Estoque</a>
</div>

<div class="card shadow-sm p-4">
    <form method="POST" action="{{ url_for('entrada_estoque') }}">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="id_produto" class="form-label">Produto / Medicamento</label>
                <select class="form-select" id="id_produto" name="id_produto" required>
                    <option value="">Selecione um produto</option>
                    {% for p in produtos %}
                        <option value="{{ p.id_produto }}">{{ p.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label for="id_fornecedor" class="form-label">Fornecedor</label>
                <select class="form-select" id="id_fornecedor" name="id_fornecedor">
                    <option value="">Selecione um fornecedor (Opcional)</option>
                    {% for f in fornecedores %}
                        <option value="{{ f.id_fornecedor }}">{{ f.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="numero_lote" class="form-label">Número do Lote</label>
                <input type="text" class="form-control" id="numero_lote" name="numero_lote" placeholder="Ex: LOT-2026-01" required>
            </div>

            <div class="col-md-6 mb-3">
                <label for="data_validade" class="form-label">Data de Validade</label>
                <input type="date" class="form-control" id="data_validade" name="data_validade" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="quantidade" class="form-label">Quantidade Recebida</label>
                <input type="number" class="form-control" id="quantidade" name="quantidade" min="1" value="1" required>
            </div>

            <div class="col-md-6 mb-3">
                <label for="preco_custo" class="form-label">Preço de Custo Unitário (R$)</label>
                <input type="number" step="0.01" class="form-control" id="preco_custo" name="preco_custo" placeholder="0.00" required>
            </div>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-success">Salvar Entrada de Estoque</button>
        </div>
    </form>
</div>
{% endblock %}
