<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Acesso - Drogaria MaLu</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fdf0f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #880e4f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        a { display: block; text-align: center; margin-top: 15px; color: #880e4f; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #880e4f; text-align: center; margin-top: 0;">Novo Acesso</h2>

        <form action="/cadastrar-usuario" method="POST">
            <label style="font-weight: bold; font-size: 14px;">Nome:</label>
            <input type="text" name="nome" placeholder="ex: João Silva" required>

            <label style="font-weight: bold; font-size: 14px;">Usuário de Acesso:</label>
            <input type="text" name="login" placeholder="ex: joao.silva" required>

            <label style="font-weight: bold; font-size: 14px;">Senha:</label>
            <input type="password" name="senha" placeholder="Digite a senha" required>

            <button type="submit">Cadastrar Acesso</button>
        </form>

        <a href="/login">Voltar para o Login</a>
    </div>
</body>
</html>
